name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icon resources
        run: npm run build

      - name: Verify generated resources
        run: npm run check

      - name: Sanity-check generated tree
        run: |
          test -f android/app/src/main/res/xml/appfilter.xml
          test "$(ls icons/png/xxxhdpi | wc -l)" -ge 70
          echo "$(ls icons/png/xxxhdpi | wc -l) icons generated"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest|resources.arsc|res/xml/appfilter" | head -20

      - name: Verify the app actually has a UI
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          # Regression guard for the black screen: the platform Activity built
          # fine and drew nothing, so assert on the compiled artifact instead.
          unzip -l "$APK" | grep -q "classes.dex" || { echo "::error::no dex — the UI did not compile"; exit 1; }
          AAPT2="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt | head -2
          grep -q "launchable-activity: name='com.crimsonmoon.iconpack.MainActivity'" /tmp/badging.txt
          grep -q "uses-permission: name='android.permission.QUERY_ALL_PACKAGES'" /tmp/badging.txt
          unzip -l "$APK" | grep -q "res/xml/appfilter.xml"

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crimson-moon-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: crimson-moon-apk
          path: crimson-moon-debug.apk
          if-no-files-found: error
          retention-days: 90
