<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New icons review</title>
<style>
  :root{--ink:#050306;--crimson:#ff2f5d;--text:#f6e7ec}
  body{margin:0;background:var(--ink);color:var(--text);font:12px/1.35 system-ui,sans-serif;padding:22px}
  h1{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--crimson);margin:0 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:14px 6px}
  figure{margin:0;text-align:center}
  img{width:82px;height:82px}
  figcaption{font-size:10px;color:rgba(246,231,236,.7)}
  figcaption em{display:block;font-style:normal;font-size:8.5px;color:rgba(246,231,236,.32)}
</style>
</head>
<body>
<h1>New icons · this pass</h1>
<div class="grid" id="g"></div>
<script>
const items = [
  ["compass","Compass"],["security","Security"],["services","Services & feedback"],["miweather","Weather"],
  ["mifiles","File Manager"],["miremote","Mi Remote"],["mivideo","Mi Video"],["mibrowser","Mi Browser"],
  ["mimusic","Mi Music"],["minotes","Notes"],["gamecenter","Game Center"],["downloads","Downloads"],
  ["google","Google"],["assistant","Assistant"],["googletv","Google TV"],["googlehome","Google Home"],
  ["googleone","Google One"],["gemini","Gemini"],["wallpapers","Wallpapers"],["authenticator","Authenticator"],
  ["msauth","MS Authenticator"],["f1","F1"],["motogp","MotoGP"],["duckduckgo","DuckDuckGo"],
  ["galaxywear","Galaxy Wear"],["chatgpt","ChatGPT"],["chollo","Chollometro"],["hp","HP"],
  ["daily","daily.dev"],["elpais","El Pais"],["gree","Gree+"],["kick","Kick"],
  ["kwgt","KWGT"],["life360","Life360"],["localsend","LocalSend"],["pluto","Pluto TV"],
  ["psapp","PS App"],["psremote","PS Remote"],["samsunghealth","Samsung Health"],["soundconnect","Sound Connect"],
  ["splitwise","Splitwise"],["steam","Steam"],["ubereats","Uber Eats"],["vlc","VLC"],["zoho","Zoho People"],
];
document.getElementById("g").innerHTML = items.map(([id,label]) =>
  `<figure><img src="../icons/png/xxxhdpi/${id}.png" alt="${label}"><figcaption>${label}<em>${id}</em></figcaption></figure>`).join("");
</script>
</body>
</html>
