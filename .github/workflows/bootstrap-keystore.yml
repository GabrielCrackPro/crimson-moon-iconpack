name: Bootstrap release keystore

# One-off: generates the release signing key on a runner and uploads it as a
# short-lived artifact. Deleted from the repo once the secrets are set.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype PKCS12 \
            -alias crimsonmoon \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Crimson Moon, OU=Icon Pack, O=GabrielCrackPro, C=BR" \
            -storepass "$password" \
            -keypass "$password"
          mkdir -p out
          mv release.jks out/
          printf 'CM_KEYSTORE_PASSWORD=%s\nCM_KEY_PASSWORD=%s\nCM_KEY_ALIAS=crimsonmoon\n' "$password" "$password" > out/credentials.env
          chmod 600 out/release.jks out/credentials.env
          keytool -list -keystore out/release.jks -storepass "$password" | grep -E "crimsonmoon|SHA256"

      - uses: actions/upload-artifact@v7
        with:
          name: release-keystore
          path: out/
          if-no-files-found: error
          retention-days: 1
