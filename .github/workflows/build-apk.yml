name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icon resources
        run: npm run build

      - name: Verify generated resources
        run: npm run check

      - name: Sanity-check generated tree
        run: |
          test -f android/app/src/main/res/xml/appfilter.xml
          test "$(ls icons/png/xxxhdpi | wc -l)" -ge 70
          echo "$(ls icons/png/xxxhdpi | wc -l) icons generated"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Assemble debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          unzip -l "$APK" | grep -E "AndroidManifest|resources.arsc|res/xml/appfilter" | head -20

      - name: Rename artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk crimson-moon-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crimson-moon-apk
          path: crimson-moon-debug.apk
          if-no-files-found: error
          retention-days: 90
